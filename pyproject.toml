[project]
name = "edge-vision-lab"
version = "0.1.0"
description = "Small, standalone experiments from learning embedded vision and edge systems"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "opencv-python-headless>=5.0,<6",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110  # printed tables read better on one line
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
